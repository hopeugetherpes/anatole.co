[hidden]{display:none!important}html,body{margin:0;height:100%;overflow:hidden}
button{cursor:pointer}button:focus-visible{outline:2px dotted #000;outline-offset:-3px}
#paint-window{max-width:calc(100vw - 16px);max-height:calc(100dvh - 16px);display:flex;flex-direction:column}

#paint-menu{position:absolute;z-index:20;min-width:230px;max-width:calc(100% - 8px);background:#d1d5db;border:2px outset white;box-shadow:3px 3px 0 #0007;padding:3px;font-size:13px}

#paint-menu button:hover:not(:disabled),#paint-menu button:focus-visible{background:#000080;color:white;outline:0}
#paint-menu button:disabled{color:#777;cursor:default}#paint-menu hr{border:0;border-top:1px solid #999;margin:3px}
.menu-shortcut{font-size:11px;color:inherit;opacity:.7}
#paint-statusbar{display:flex;justify-content:space-between;gap:12px;flex:none;font-size:11px;line-height:20px;padding:0 6px;border-top:1px solid #9ca3af;background:#d1d5db;white-space:nowrap}
#paint-status{flex:1;overflow:hidden;text-overflow:ellipsis}
#paint-restore{position:fixed;bottom:12px;left:12px;padding:6px 24px;background:#d1d5db;border:2px outset white;box-shadow:2px 2px #0005;font-size:14px}
#paint-window.is-maximized{left:8px;top:8px;transform:none;width:calc(100vw - 16px);height:calc(100dvh - 16px)}
#paint-window.is-maximized #paint-workarea{flex:1}#paint-window.is-maximized #paint-viewport{height:auto!important;max-height:none}

  async function undoRedo(delta) {
    if (busy || drawing) return;
    const next = historyIndex + delta;
    if (next < 0 || next >= history.length) return;
    busy = true;
    try {
      const entry = history[next], img = await imageFrom(entry.data);
      canvas.width = entry.width; canvas.height = entry.height;
      ctx.drawImage(img, 0, 0); historyIndex = next;
      updateScale(); updateTitle(); setStatus(delta < 0 ? 'Undo' : 'Redo');
    } catch (error) { alert(error.message); }
    finally { busy = false; }
  }
  function mayDiscard() {
    return !dirty() || confirm('This drawing has unsaved changes. Continue without saving them?');
  }
  function newDrawing() {
    if (!mayDiscard()) return;
    canvas.width = 2000; canvas.height = 2000; white();
    filename = 'untitled.png'; zoom = 1; updateScale(); freshHistory();
    viewport.scrollTo(0, 0); setStatus('New image');
  }
  function download(blob, name) {
    const url = URL.createObjectURL(blob), link = document.createElement('a');
    link.href = url; link.download = name;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  function safeFilename(value) {
    return value.replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').slice(0, 120) || 'untitled.png';
  }
  function savePng() {
    const imageAtSave = history[historyIndex].data;
    const nameAtSave = filename.replace(/\.[^.]+$/, '') + '.png';
    canvas.toBlob(blob => {
      if (!blob) { alert('The PNG could not be created.'); return; }
      download(blob, nameAtSave); savedImage = imageAtSave;
      updateTitle(); setStatus('PNG downloaded');
    }, 'image/png');
  }
  function savePortable() {
    const doc = new DOMParser().parseFromString(template, 'text/html');
    doc.getElementById('paint-document').textContent = JSON.stringify({
      version: 1, image: png(), filename
    }).replace(/</g, '\\u003c');
    const html = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
    download(new Blob([html], {type: 'text/html;charset=utf-8'}),
      filename.replace(/\.[^.]+$/, '') + '-Paint.html');
    savedImage = history[historyIndex].data;
    updateTitle(); setStatus('Portable HTML downloaded with your drawing');
  }
  function chooseOpen() { if (mayDiscard()) $('paint-open').click(); }
  $('paint-open').addEventListener('change', async event => {
    const file = event.target.files[0]; event.target.value = '';
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) { alert('Please choose an image smaller than 50 MB.'); return; }
    if (!/\.(png|jpe?g|webp|bmp|gif|avif)$/i.test(file.name)) {
      alert('Choose a PNG, JPEG, WebP, BMP, GIF or AVIF image.'); return;
    }
    busy = true;
    const url = URL.createObjectURL(file);
    try {
      const img = await imageFrom(url);
      if (img.naturalWidth > MAX_SIDE || img.naturalHeight > MAX_SIDE ||
          img.naturalWidth * img.naturalHeight > MAX_AREA) {
        throw new Error('Please choose an image no larger than 4096 × 4096 pixels.');
      }
      canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
      white(); ctx.drawImage(img, 0, 0);
      filename = safeFilename(file.name).replace(/\.[^.]+$/, '') + '.png';
      zoom = 1; updateScale(); freshHistory(); viewport.scrollTo(0, 0);
      setStatus('Image opened');
    } catch (error) { alert(error.message); }
    finally { URL.revokeObjectURL(url); busy = false; }
  });

  function selectTool(next) {
    tool = next;
    document.querySelectorAll('[data-tool]').forEach(button => {
      const active = button.dataset.tool === tool;
      button.setAttribute('aria-pressed', String(active));
      button.classList.toggle('tool-active', active);
    });
    canvas.style.cursor = tool === 'eraser' ? 'cell' : 'crosshair';
    setStatus((tool === 'brush' ? 'Brush · ' + brushSize : 'Eraser · ' + eraserSize) + ' px');
  }
  document.querySelectorAll('[data-tool]').forEach(button =>
    button.addEventListener('click', () => selectTool(button.dataset.tool)));
  function selectColor(value) {
    color = value;
    document.querySelectorAll('[data-color]').forEach(button => {
      const active = button.dataset.color.toUpperCase() === color.toUpperCase();
      button.classList.toggle('ring-1', active); button.classList.toggle('ring-gray-600', active);
      button.setAttribute('aria-pressed', String(active));
    });
    setStatus('Colour: ' + color);
  }
  document.querySelectorAll('[data-color]').forEach(button =>
    button.addEventListener('click', () => selectColor(button.dataset.color)));
  $('paint-color').addEventListener('input', event => selectColor(event.target.value));
  function point(event) {
    const rect = canvas.getBoundingClientRect();
    return {x: (event.clientX - rect.left) * canvas.width / rect.width,
      y: (event.clientY - rect.top) * canvas.height / rect.height};
  }
  function drawLine(from, to) {
    ctx.strokeStyle = tool === 'eraser' ? '#FFFFFF' : color;
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = tool === 'eraser' ? eraserSize : brushSize;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
    if (from.x === to.x && from.y === to.y) {
      ctx.beginPath(); ctx.arc(to.x, to.y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill();
    }
  }
  canvas.addEventListener('pointerdown', event => {
    if (busy || drawing || event.button !== 0) return;
    event.preventDefault(); closeMenu();
    canvas.setPointerCapture(event.pointerId);
    drawing = {id: event.pointerId, last: point(event)};
    drawLine(drawing.last, drawing.last);
  });
  canvas.addEventListener('pointermove', event => {
    const current = point(event);
    $('paint-coordinates').textContent = Math.round(current.x) + ', ' + Math.round(current.y);
    if (drawing && drawing.id === event.pointerId) {
      drawLine(drawing.last, current); drawing.last = current;
    }
  });
  function endDrawing(event) {
    if (!drawing || (event && event.pointerId !== drawing.id)) return;
    const id = drawing.id;
    drawing = null;
    if (canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id);
    remember();
  }
  canvas.addEventListener('pointerup', endDrawing);
  canvas.addEventListener('pointercancel', endDrawing);
  canvas.addEventListener('lostpointercapture', endDrawing);
  canvas.addEventListener('contextmenu', event => event.preventDefault());

  function clearImage() {
    if (confirm('Clear the image? You can undo this action.')) { white(); remember(); setStatus('Image cleared'); }
  }
  function transformImage(action) {
    const copy = document.createElement('canvas');
    copy.width = canvas.width; copy.height = canvas.height;
    copy.getContext('2d').putImageData(ctx.getImageData(0, 0, canvas.width, canvas.height), 0, 0);
    if (action === 'rotate') {
      canvas.width = copy.height; canvas.height = copy.width;
      ctx.save(); ctx.translate(canvas.width, 0); ctx.rotate(Math.PI / 2);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.save();
      ctx.translate(action === 'flip-h' ? canvas.width : 0, action === 'flip-v' ? canvas.height : 0);
      ctx.scale(action === 'flip-h' ? -1 : 1, action === 'flip-v' ? -1 : 1);
    }
    ctx.drawImage(copy, 0, 0); ctx.restore(); updateScale(); remember(); setStatus('Image transformed');
  }
  function setSize() {
    const value = prompt('Size in pixels (1–100):', String(tool === 'eraser' ? eraserSize : brushSize));
    if (value === null) return;
    const number = Number(value);
    if (!Number.isInteger(number) || number < 1 || number > 100) {
      alert('Enter a whole number from 1 to 100.'); return;
    }
    if (tool === 'eraser') eraserSize = number; else brushSize = number;
    selectTool(tool);
  }
  function setZoom(value) { zoom = value; updateScale(); setStatus('Zoom: ' + Math.round(zoom * 100) + '%'); }
  function toggleMaximize() {
    closeMenu();
    if (!maximized) {
      normalBounds = win.getAttribute('style'); win.removeAttribute('style');
      win.classList.add('is-maximized');
    } else {
      win.classList.remove('is-maximized'); win.setAttribute('style', normalBounds || '');
    }
    maximized = !maximized;
  }
  function minimize() { win.hidden = true; $('paint-restore').hidden = false; closeMenu(); }
  $('paint-restore').addEventListener('click', () => { win.hidden = false; $('paint-restore').hidden = true; });
  $('paint-minimize').addEventListener('click', minimize);
  $('paint-maximize').addEventListener('click', toggleMaximize);
  $('paint-close').addEventListener('click', () => { if (mayDiscard()) minimize(); });
  const titlebar = $('paint-titlebar');
  titlebar.addEventListener('dblclick', event => { if (!event.target.closest('button')) toggleMaximize(); });
  titlebar.addEventListener('pointerdown', event => {
    if (event.button !== 0 || maximized || event.target.closest('button')) return;
    event.preventDefault();
    const rect = win.getBoundingClientRect();
    win.style.transform = 'none'; win.style.left = rect.left + 'px'; win.style.top = rect.top + 'px';
    dragging = {id: event.pointerId, x: event.clientX - rect.left, y: event.clientY - rect.top};
    titlebar.setPointerCapture(event.pointerId);
  });
  titlebar.addEventListener('pointermove', event => {
    if (!dragging || dragging.id !== event.pointerId) return;
    win.style.left = Math.max(0, Math.min(innerWidth - 80, event.clientX - dragging.x)) + 'px';
    win.style.top = Math.max(0, Math.min(innerHeight - 35, event.clientY - dragging.y)) + 'px';
  });
  function endDrag() { dragging = null; }
  titlebar.addEventListener('pointerup', endDrag);
  titlebar.addEventListener('pointercancel', endDrag);
  titlebar.addEventListener('lostpointercapture', endDrag);

  const actions = {
    new: newDrawing, open: chooseOpen, save: savePng, portable: savePortable,
    undo: () => undoRedo(-1), redo: () => undoRedo(1), clear: clearImage,
    maximize: toggleMaximize, zoom100: () => setZoom(1), zoom50: () => setZoom(.5), zoom25: () => setZoom(.25),
    rotate: () => transformImage('rotate'), flipH: () => transformImage('flip-h'), flipV: () => transformImage('flip-v'),
    size: setSize, color: () => $('paint-color').click(),
    help: () => alert('Draw with the brush or erase with the eraser. Choose a colour below the canvas.\n\nB: brush · E: eraser\nCtrl/Cmd+Z: undo · Ctrl/Cmd+Shift+Z: redo\nCtrl/Cmd+O: open an image\nCtrl/Cmd+S: save as PNG\nCtrl/Cmd+Shift+S: save a portable HTML with the current drawing\n\nUse Options to change brush size. Scroll to reach the rest of the image.'),
    about: () => alert('Paint — Portable\n\nBased on your Paint page at paint.anatole.co.\nWorks directly from one HTML file, with no installation or Internet connection.\nImages stay on your device. Save your drawing before closing this tab.')
  };
  const menus = {
    File: [['New', 'new', 'Ctrl+N'], ['Open…', 'open', 'Ctrl+O'], null,
      ['Save as PNG', 'save', 'Ctrl+S'], ['Save portable HTML…', 'portable', 'Ctrl+Shift+S']],
    Edit: [['Undo', 'undo', 'Ctrl+Z'], ['Redo', 'redo', 'Ctrl+Shift+Z'], null, ['Clear image…', 'clear']],
    View: [['Maximize / Restore', 'maximize'], null, ['100%', 'zoom100'], ['50%', 'zoom50'], ['25%', 'zoom25']],
    Image: [['Rotate clockwise', 'rotate'], ['Flip horizontally', 'flipH'], ['Flip vertically', 'flipV'], null, ['Clear image…', 'clear']],
    Options: [['Brush / eraser size…', 'size'], ['Choose colour…', 'color']],
    Help: [['Using Paint…', 'help'], ['About Paint…', 'about']]
  };
  function closeMenu() {
    popup.hidden = true;
    if (menuOwner) menuOwner.setAttribute('aria-expanded', 'false');
    menuOwner = null;
  }
  function showMenu(button) {
    if (menuOwner === button && !popup.hidden) { closeMenu(); return; }
    closeMenu(); menuOwner = button; button.setAttribute('aria-expanded', 'true'); popup.replaceChildren();
    for (const entry of menus[button.textContent]) {
      if (!entry) { const hr = document.createElement('hr'); hr.setAttribute('role', 'separator'); popup.append(hr); continue; }
      const item = document.createElement('button'); item.type = 'button'; item.setAttribute('role', 'menuitem');
      item.dataset.action = entry[1];
      const label = document.createElement('span'); label.textContent = entry[0]; item.append(label);
      if (entry[2]) { const key = document.createElement('span'); key.className = 'menu-shortcut'; key.textContent = entry[2]; item.append(key); }
      item.disabled = busy || (entry[1] === 'undo' && historyIndex <= 0) || (entry[1] === 'redo' && historyIndex >= history.length - 1);
      item.addEventListener('click', () => { closeMenu(); if (!busy) actions[entry[1]](); });
      popup.append(item);
    }
    popup.hidden = false;
    const buttonRect = button.getBoundingClientRect(), windowRect = win.getBoundingClientRect();
    popup.style.top = buttonRect.bottom - windowRect.top + 'px';
    popup.style.left = Math.min(buttonRect.left - windowRect.left, win.clientWidth - popup.offsetWidth - 4) + 'px';
    popup.querySelector('button:not(:disabled)')?.focus();
  }
  document.querySelectorAll('[data-menu]').forEach(button => {
    button.addEventListener('click', () => showMenu(button));
    button.addEventListener('keydown', event => { if (event.key === 'ArrowDown') { event.preventDefault(); showMenu(button); } });
  });
  popup.addEventListener('keydown', event => {
    const items = [...popup.querySelectorAll('button:not(:disabled)')];
    const current = items.indexOf(document.activeElement);
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault(); items[(current + (event.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]?.focus();
    }
  });
  document.addEventListener('pointerdown', event => {
    if (!event.target.closest('#paint-menu') && !event.target.closest('[data-menu]')) closeMenu();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') { const owner = menuOwner; closeMenu(); owner?.focus(); return; }
    if (busy || drawing || event.target.matches('input, textarea')) return;
    const key = event.key.toLowerCase();
    if (event.ctrlKey || event.metaKey) {
      const action = key === 's' ? (event.shiftKey ? 'portable' : 'save') : key === 'o' ? 'open' :
        key === 'n' ? 'new' : key === 'z' ? (event.shiftKey ? 'redo' : 'undo') : key === 'y' ? 'redo' : null;
      if (action) { event.preventDefault(); closeMenu(); actions[action](); }
    } else if (!event.altKey && key === 'b') selectTool('brush');
    else if (!event.altKey && key === 'e') selectTool('eraser');
  });
  window.addEventListener('beforeunload', event => {
    if (dirty()) { event.preventDefault(); event.returnValue = ''; }
  });
  async function init() {
    white(); updateScale(); selectTool('brush'); selectColor('#000000');
    try {
      const embedded = JSON.parse($('paint-document').textContent);
      if (embedded.image) {
        if (!/^data:image\/png;base64,/.test(embedded.image)) throw new Error('Invalid embedded image.');
        const img = await imageFrom(embedded.image);
        if (img.naturalWidth > MAX_SIDE || img.naturalHeight > MAX_SIDE || !img.naturalWidth || !img.naturalHeight) {
          throw new Error('Embedded image is too large.');
        }
        canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
        white(); ctx.drawImage(img, 0, 0); updateScale();
        filename = safeFilename(embedded.filename || 'untitled.png');
      }
    } catch (error) { alert('The saved drawing could not be restored. ' + error.message); }
    freshHistory(); busy = false; setStatus('Ready');
  }
  init();
})();
</script></body></html>
